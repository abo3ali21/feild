services:
  backend:
    build: ./backend
    environment:
      DEMO_MODE: true
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
